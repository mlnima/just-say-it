[package]
name = "just-say-it"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "dictation_desktop"
crate-type = ["lib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
dictation-core = { path = "../crates/dictation-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
cpal = "=0.16.0"
ringbuf = "0.4"
crossbeam-channel = "0.5"
whisper-rs = { version = "=0.16.0", features = ["raw-api"] }
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"] }
sentencepiece-rs = "=0.2.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
tar = "0.4"
bzip2 = "0.5"
tempfile = "3"
fs2 = "0.4"
webrtc-vad = "=0.4.0"

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant",
  "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop",
  "Win32_System_Power", "Win32_System_Threading", "Win32_Security",
  "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_HiDpi"
] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
whisper-rs = { version = "=0.16.0", features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "=0.16.0", features = ["metal"] }

[dev-dependencies]
hound = "3.5"
